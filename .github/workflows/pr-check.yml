name: PR Quality Check

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  # 커밋 메시지 형식 검증
  commit-message-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check commit message format
        run: |
          # 허용된 커밋 타입 패턴 정의
          PATTERN="^(test|feat|refactor|fix|docs|init)(\(.+\))?: .{1,50}"
          
          # PR의 모든 커밋 메시지 검사
          INVALID_COMMITS=""
          
          for commit in $(git rev-list origin/${{ github.base_ref }}..${{ github.head_ref }}); do
            COMMIT_MSG=$(git log --format=%s -n 1 $commit)
            echo "Checking commit: $COMMIT_MSG"
            
            if ! echo "$COMMIT_MSG" | grep -qE "$PATTERN"; then
              INVALID_COMMITS="$INVALID_COMMITS\n- $COMMIT_MSG"
            fi
          done
          
          if [ -n "$INVALID_COMMITS" ]; then
            echo "❌ Invalid commit message format detected:"
            echo -e "$INVALID_COMMITS"
            echo ""
            echo "✅ Valid format examples:"
            echo "- feat: 새로운 사용자 인증 기능 추가"
            echo "- fix: 로그인 버그 수정"
            echo "- docs: README 업데이트"
            echo "- test: 사용자 API 테스트 추가"
            echo "- refactor: 코드 구조 개선"
            echo "- init: 프로젝트 초기 설정"
            exit 1
          else
            echo "✅ All commit messages follow conventional format"
          fi

  # 코드 품질 검사
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          echo "🔍 Running ESLint..."
          npm run lint

      - name: Run Prettier check
        run: |
          echo "🎨 Checking code formatting..."
          npx prettier --check "src/**/*.ts" "test/**/*.ts" --ignore-path .prettierignore

      - name: Build project
        run: |
          echo "🏗️ Building project..."
          npm run build

  # 테스트 실행 (DB, middleware 연결 제외)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (without DB)
        run: |
          echo "🧪 Running unit tests..."
          npm test

      - name: Generate test coverage
        run: |
          echo "📊 Generating test coverage..."
          npm run test:cov

  # E2E 테스트 실행 (실제 DB 사용)
  test-e2e:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: recipot_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -u root -ptest_password -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=40s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Wait for MariaDB to be ready
        run: |
          echo "⏳ Waiting for MariaDB to be ready..."
          for i in {1..30}; do
            if timeout 2 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/3306" 2>/dev/null; then
              echo "✅ MariaDB port is open!"
              sleep 5
              echo "✅ MariaDB is ready!"
              exit 0
            fi
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
          done
          echo "❌ MariaDB failed to start"
          exit 1

      - name: Run E2E tests
        env:
          DB_TYPE: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: recipot_test
          # Redis 설정
          REDIS_CONNECTION_TYPE: redis
          REDIS_CONNECTION_HOST: 127.0.0.1
          REDIS_CONNECTION_PORT: 6379
          REDIS_CONNECTION_TTL: 3600
          # JWT 설정 (테스트용 - AuthModule 로드 시 필요)
          JWT_ALGORITHM: HS256
          JWT_ACCESS_SECRET: ${{ secrets.TEST_JWT_ACCESS_SECRET }}
          JWT_ACCESS_EXPIRE: 3600
          JWT_REFRESH_SECRET: ${{ secrets.TEST_JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRE: 86400
          # 테스트 환경 설정
          NODE_ENV: test
        run: |
          echo "🧪 Running E2E tests with real database..."
          npm run test:e2e

  # PR 요약 생성
  pr-summary:
    runs-on: ubuntu-latest
    needs: [commit-message-check, quality-check, test, test-e2e]
    if: always()
    steps:
      - name: PR 요약 생성
        run: |
          echo "## 🔍 PR 품질 검사 결과" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.commit-message-check.result }}" == "success" ]; then
            echo "✅ **커밋 메시지**: 모든 커밋이 규칙을 준수합니다" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **커밋 메시지**: 일부 커밋이 규칙을 위반했습니다" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.quality-check.result }}" == "success" ]; then
            echo "✅ **코드 품질**: ESLint, Prettier, 빌드가 성공했습니다" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **코드 품질**: 린트 또는 빌드에서 문제가 발견되었습니다" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ **단위 테스트**: 모든 단위 테스트가 통과했습니다" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **단위 테스트**: 일부 단위 테스트가 실패했습니다" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.test-e2e.result }}" == "success" ]; then
            echo "✅ **E2E 테스트**: 모든 E2E 테스트가 통과했습니다" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **E2E 테스트**: 일부 E2E 테스트가 실패했습니다" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 다음 단계" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.commit-message-check.result }}" == "success" ] && [ "${{ needs.quality-check.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.test-e2e.result }}" == "success" ]; then
            echo "🎉 **병합 준비 완료!** 모든 검사가 성공적으로 통과했습니다." >> $GITHUB_STEP_SUMMARY
          else
            echo "🔧 **조치 필요** - 병합하기 전에 실패한 검사를 수정해주세요." >> $GITHUB_STEP_SUMMARY
          fi