name: recipot CI/CD

on:
  push:
    branches: [develop]

concurrency:
  group: recipot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'docs:')"

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      repository: ${{ steps.meta.outputs.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Compute image tag and repo
        id: meta
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "repository=488599977281.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin 488599977281.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build and Push Docker image
        run: |
          FULL_REPOSITORY="${{ steps.meta.outputs.repository }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
          docker build -t "$FULL_REPOSITORY:$IMAGE_TAG" -t "$FULL_REPOSITORY:latest" .
          docker push "$FULL_REPOSITORY:$IMAGE_TAG"
          docker push "$FULL_REPOSITORY:latest"

  deploy:
    name: Deploy to EC2 (update only docker-compose.yml)
    runs-on: ubuntu-latest
    needs: build_and_push
    if: "!contains(github.event.head_commit.message, 'docs:')"

    steps:
      - name: Prepare SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 --decode > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy over SSH
        env:
          GITHUB_READ_TOKEN: ${{ secrets.GITHUB_READ_TOKEN }}     # 레포 읽기 권한 토큰
          REPO_FULL: ${{ github.repository }}                     # org/repo
          IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -Eeuo pipefail

            APP_DIR=/home/ubuntu/recipot-backend
            BRANCH=develop
            FILE=docker-compose.yml

            # 작업 디렉토리 준비
            mkdir -p "\$APP_DIR"
            cd "\$APP_DIR"

            # docker-compose.yml 최신본만 가져오기 (전체 git pull 없음)
            curl -sSL \
              -H "Authorization: token ${GITHUB_READ_TOKEN}" \
              -H "Accept: application/vnd.github.v3.raw" \
              -o "\$FILE" \
              "https://api.github.com/repos/${REPO_FULL}/contents/\$FILE?ref=\$BRANCH"

            # ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 | \
            docker login --username AWS --password-stdin 488599977281.dkr.ecr.ap-northeast-2.amazonaws.com

            # 배포
            export INFISICAL_TOKEN='${{ secrets.INFISICAL_SERVICE_TOKEN }}'
            export IMAGE_TAG='${IMAGE_TAG}'

            # Infisical run으로 환경 변수 주입하면서 Docker Compose 실행
            infisical run --env=prod --path=/env -- docker compose pull recipot-api
            infisical run --env=prod --path=/env -- docker compose up -d --no-deps recipot-api
          EOF

      - name: Write deployment summary
        run: |
          echo "## 📦 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image Tag: ${{ needs.build_and_push.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: $GITHUB_REF_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY