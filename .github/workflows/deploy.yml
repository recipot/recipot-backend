name: recipot CI/CD

on:
  push:
    branches: [feature/fix-workflow]

jobs:
  # 1. 코드 체크아웃 및 이미지 태그 설정
  setup:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'docs:')"
    outputs:
      image-tag: ${{ steps.set-image-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set IMAGE_TAG
        id: set-image-tag
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

  # 2. 코드 품질 검사
  code-quality:
    runs-on: ubuntu-latest
    needs: setup
    if: "!contains(github.event.head_commit.message, 'docs:')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run build

  # 3. Docker 이미지 빌드 및 푸시
  build-and-push:
    runs-on: ubuntu-latest
    needs: [setup, code-quality]
    if: "!contains(github.event.head_commit.message, 'docs:')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin 488599977281.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build and Push Docker image
        run: |
          FULL_REPOSITORY="488599977281.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}"
          docker build -t $FULL_REPOSITORY:${{ needs.setup.outputs.image-tag }} -t $FULL_REPOSITORY:latest .
          docker push $FULL_REPOSITORY:${{ needs.setup.outputs.image-tag }}
          docker push $FULL_REPOSITORY:latest

  # 4. EC2 배포
  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    if: "!contains(github.event.head_commit.message, 'docs:')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        env:
          GITHUB_READ_TOKEN: ${{ secrets.GIT_READ_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          BRANCH: develop
          IMAGE_TAG: ${{ needs.setup.outputs.image-tag }}
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > private_key.pem
          chmod 600 private_key.pem

          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -Eeuo pipefail

            APP_DIR=/home/ubuntu/recipot-backend
            FILE=docker-compose.yml

            mkdir -p "\$APP_DIR"
            cd "\$APP_DIR"

            # 기존 파일 백업(있을 경우)
            if [ -f "\$FILE" ]; then
              cp -f "\$FILE" "\$FILE.bak.$(date +%Y%m%d%H%M%S)"
            fi

            # docker-compose.yml 최신본만 가져오기
            curl -sSL \
              -H "Authorization: token ${GITHUB_READ_TOKEN}" \
              -H "Accept: application/vnd.github.v3.raw" \
              -o "\$FILE" \
              "https://api.github.com/repos/${REPO_FULL}/contents/\$FILE?ref=${BRANCH}"

            # ECR 로그인(EC2 리전 기준)
            aws ecr get-login-password --region ap-northeast-2 | \
            docker login --username AWS --password-stdin 488599977281.dkr.ecr.ap-northeast-2.amazonaws.com

            # Infisical 토큰/이미지 태그 주입 후 배포
            export INFISICAL_TOKEN='${{ secrets.INFISICAL_SERVICE_TOKEN }}'
            export IMAGE_TAG='${{ needs.setup.outputs.image-tag }}'

            # 변수 누락 시 compose에서 바로 실패하도록 ${VAR?err} 사용 권장
            infisical run --env=prod --path=/env -- docker compose pull recipot-api
            infisical run --env=prod --path=/env -- docker compose up -d --no-deps recipot-api
          EOF

      - name: Write deployment summary
        run: |
          echo "## 📦 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image Tag: ${{ needs.setup.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: $GITHUB_REF_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✅ Successfully deployed to EC2" >> $GITHUB_STEP_SUMMARY