services:
  recipot-mariadb:
    container_name: recipot-mariadb
    image: mariadb:10.8.2
    ports: 
      - "3306:3306"
    env_file:
      - .env.local
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ./docker/mariadb/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docker-network
    restart: always

  recipot-mariadb-init:
    image: mariadb:10.8.2
    depends_on:
      recipot-mariadb:
        condition: service_started
    env_file:
      - .env.local
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    command: >
      bash -c "
      until mysqladmin ping -h recipot-mariadb -u root -p$$MYSQL_ROOT_PASSWORD --silent; do sleep 1; done &&
      mysql -h recipot-mariadb -u root -p$$MYSQL_ROOT_PASSWORD -e \"CREATE DATABASE IF NOT EXISTS \`recipot_test\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON \`recipot_test\`.* TO 'recipot'@'%'; FLUSH PRIVILEGES;\" 2>/dev/null || true
      "
    networks:
      - docker-network
    restart: "no"

  recipot-redis:
    container_name: recipot-redis
    image: redis:7.2.4-alpine3.19
    ports:
      - 6379:6379
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./docker/redis/data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./docker/redis/user.acl:/usr/local/etc/redis/user.acl
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - docker-network
    restart: always

networks:
  docker-network:
    external: true


